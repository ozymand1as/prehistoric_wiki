# Jekyll Configuration for Primitive Tech Wiki

title: Primitive Tech Wiki
description: A knowledge base documenting prehistoric and early historical technologies

# Build settings
markdown: kramdown
highlighter: rouge

# Default layout settings
defaults:
  - scope:
      path: ""
    values:
      layout: null

# Exclude from build
exclude:
  - .git
  - .github/
  - Gemfile*
  - state.md
  - docs/
  - README.md

# Enable collections
collections:
  wiki:
    output: true
    permalink: /:collection/:path/

# Source wiki directory as collection
watch:
  - wiki