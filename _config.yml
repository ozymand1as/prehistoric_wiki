# Jekyll Configuration for Primitive Tech Wiki

title: Primitive Tech Wiki
description: A knowledge base documenting prehistoric and early historical technologies
baseurl: "/prehistoric_wiki"

# Build settings
markdown: kramdown
highlighter: rouge

# Default layout settings
defaults:
  - scope:
      path: ""
    values:
      layout: null
  - scope:
      path: "_wiki"
    values:
      layout: null
  - scope:
      path: "wiki"
    values:
      layout: null
  - scope:
      path: "NAVIGATION.md"
    values:
      permalink: /wiki/NAVIGATION.html
      layout: null
  - scope:
      path: "OPEN-QUESTIONS-INDEX.md"
    values:
      permalink: /wiki/OPEN-QUESTIONS-INDEX.html
      layout: null
  - scope:
      path: "Timeline.md"
    values:
      permalink: /wiki/Timeline.html
      layout: null
  - scope:
      path: "INDEX.md"
    values:
      permalink: /wiki/INDEX.html
      layout: null

# Enable collections for proper URL structure
collections:
  wiki:
    output: true
    path: wiki
    permalink: /wiki/:path.html
  _wiki:
    output: true
    permalink: /wiki/:path.html

# Exclude from build
exclude:
  - .git
  - .github/
  - Gemfile*
  - state.md
  - docs/
  - README.md

watch:
  - wiki