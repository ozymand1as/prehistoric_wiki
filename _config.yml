# Primitive Tech Wiki - GitHub Pages Configuration

# Site metadata
title: Primitive Tech Wiki
description: A knowledge base documenting prehistoric and early historical technologies from the Stone Age through the Bronze Age

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  wrap: hard
  auto_ids: true

# Exclude files
exclude:
  - .DS_Store
  - .git
  - .gitignore
  - .pi
  - .prototools
  - state.md
  - .DS_Store
  - docs/
  - wiki-org/

# Collection settings
collections:
  wiki:
    output: true
    permalink: /:collection/:path/
