# Jekyll Configuration for Primitive Tech Wiki

title: Primitive Tech Wiki
description: A knowledge base documenting prehistoric and early historical technologies
baseurl: "/prehistoric_wiki"

# Build settings
markdown: kramdown
highlighter: rouge

# Default layout settings
defaults:
  - scope:
      path: ""
    values:
      layout: null

# Enable collections for proper URL structure
collections:
  wiki:
    output: true

# Exclude from build
exclude:
  - .git
  - .github/
  - Gemfile*
  - state.md
  - docs/
  - README.md
  - wiki/MEDICINE/research-findings-traditional-medicine-full.md
  - wiki/MEDICINE/research-findings-traditional-medicine-prehistoric.md
  - wiki/OPEN-QUESTIONS.md
  - wiki/NAVIGATION.md
  - wiki/OPEN-QUESTIONS-INDEX.md

watch:
  - wiki