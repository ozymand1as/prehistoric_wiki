# Primitive Tech Wiki - GitHub Pages Configuration

title: Primitive Tech Wiki
description: A knowledge base documenting prehistoric and early historical technologies from the Stone Age through the Bronze Age

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  wrap: hard
  auto_ids: true

exclude:
  - .DS_Store
  - .git
  - .gitignore
  - .pi
  - .prototools
  - state.md
  - docs/
  - wiki-org/
  - Gemfile*
  - gemfiles/
  - vendor/

defaults:
  - scope:
      path: wiki
    values:
      layout: null
      bare: true

highlighter: rouge
theme: minima